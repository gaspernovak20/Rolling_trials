<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Rolling_Trials</title>

    <script type="importmap">
    {
        "imports": {
            "engine/": "./engine/",
            "dat": "./lib/dat.js",
            "glm": "./lib/glm.js"
        }
    }
    </script>

    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../../../engine/style.css">

    <style>
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
        }

        #overlay img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #playButton {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 100px;
            background-image: url("images/PlayButton.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            background-color: transparent;
            cursor: pointer;
            z-index: 2;
        }

        #playButton:hover {
            transform: translateX(-50%) scale(1.05);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        #keyOverlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-family: sans-serif;
            user-select: none;
            z-index: 100;
        }

        #keyOverlay .key {
            width: 50px;
            height: 50px;
            background-color: #555;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.1s;
        }

        #keyOverlay .key.active {
            background-color: rgba(154, 154, 154, 1);
            color: white;
        }

        #abilityOverlay {
            position: fixed;
            top: 20px;
            right: 20px;
            font-family: sans-serif;
            z-index: 2001;
            background: #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        #diamondCounter {
            position: fixed;
            top: 20px;
            left: 20px;
            font-family: sans-serif;
            font-size: 24px;
            color: #fff;
            z-index: 2000;
            background: transparent;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <img src="images/RollingTrailsStartScreen.png" alt="Rolling Trials">
        <button id="playButton"></button>
    </div>

    <div class="fullscreen no-touch pixelated">
        <canvas></canvas>
    </div>

</body>

</html>
