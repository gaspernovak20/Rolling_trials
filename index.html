<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rolling_Trials</title>
    <link rel="icon" href="images/icon.ico">

    <script type="importmap">
    {
        "imports": {
            "engine/": "./engine/",
            "dat": "./lib/dat.js",
            "glm": "./lib/glm.js"
        }
    }
    </script>

    <script type="module" src="main.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
        }

        #overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #playButton {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: url("images/PlayButton.png") no-repeat center/contain;
            border: none;
            cursor: pointer;
        }

        #playButton:hover {
            transform: translateX(-50%) scale(1.05);
            transition: transform 0.2s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <img src="images/RollingTrailsStartScreen.png" alt="Rolling Trials">
        <button id="playButton"></button>
    </div>

    <canvas></canvas>

    <script>
        const overlay = document.getElementById('overlay');
        const playButton = document.getElementById('playButton');

        playButton.addEventListener('click', () => {
            overlay.style.display = 'none';
        });
    </script>
</body>
</html>
